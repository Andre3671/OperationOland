name: Deploy

# Runs on the self-hosted Unraid runner (same one used by WeatherCompare) so
# we can build the Docker images and restart the containers without external
# services.
#
# Triggers:
#   - Push to main → automatic deploy
#   - Manual trigger from the Actions tab → "Run workflow"
#
# Required secrets:
#   VITE_ORS_API_KEY  — OpenRouteService key, baked into the SPA bundle
#                       at build time (Vite inlines all VITE_* envs).
#   ADMIN_TOKEN       — shared secret for the sync service. Admin device
#                       sends it as X-Admin-Token; without it the sync
#                       server runs in OPEN MODE.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "memory/**"
  workflow_dispatch:

concurrency:
  group: deploy-operationoland
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, unraid]
    timeout-minutes: 15

    env:
      SPA_CONTAINER: operationoland
      SYNC_CONTAINER: operationoland-sync
      SPA_IMAGE: operationoland:latest
      SYNC_IMAGE: operationoland-sync:latest
      SYNC_VOLUME: operationoland_sync-data
      NETWORK: authentik_network
      HOST_PORT: "8091"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop existing containers
        timeout-minutes: 2
        run: |
          # docker stop/rm can block for minutes if the daemon or a container
          # shim is wedged, so avoid the separate graceful stop and hard-cap
          # each forced remove. Two 20s attempts stay well inside the step
          # timeout and make any later name conflict easier to diagnose.
          for c in "$SPA_CONTAINER" "$SYNC_CONTAINER"; do
            if ! timeout --kill-after=5s 20s docker rm -f "$c" 2>/dev/null; then
              echo "::warning::Timed out or failed while removing $c; continuing"
            fi
          done

      - name: Ensure sync data volume exists
        run: docker volume inspect "$SYNC_VOLUME" >/dev/null 2>&1 || docker volume create "$SYNC_VOLUME"

      - name: Build sync image
        run: docker build -t "$SYNC_IMAGE" ./server

      - name: Build SPA image
        run: |
          docker build \
            --build-arg VITE_ORS_API_KEY="${{ secrets.VITE_ORS_API_KEY }}" \
            -t "$SPA_IMAGE" .

      - name: Start sync container
        run: |
          docker run -d \
            --name "$SYNC_CONTAINER" \
            --restart unless-stopped \
            --network "$NETWORK" \
            -e ADMIN_TOKEN="${{ secrets.ADMIN_TOKEN }}" \
            -e PORT=8090 \
            -e DB_PATH=/app/data/state.db \
            -v "$SYNC_VOLUME":/app/data \
            "$SYNC_IMAGE"

      - name: Start SPA container
        run: |
          docker run -d \
            --name "$SPA_CONTAINER" \
            --restart unless-stopped \
            --network "$NETWORK" \
            -p "$HOST_PORT":80 \
            "$SPA_IMAGE"

      - name: Wait for the SPA to bind
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:$HOST_PORT/" -o /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not respond on port $HOST_PORT within 30s"
          docker logs "$SPA_CONTAINER"  --tail 100
          docker logs "$SYNC_CONTAINER" --tail 100
          exit 1

      - name: Smoke tests
        run: |
          set -e
          fail=0
          for path in "/" "/admin" "/index.html" "/api/health" "/api/state"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$HOST_PORT$path")
            if [[ "$code" == 2* ]]; then
              echo "  [ok]   $path -> $code"
            else
              echo "  [FAIL] $path -> $code"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            echo "::error::One or more smoke tests failed"
            docker logs "$SPA_CONTAINER"  --tail 100
            docker logs "$SYNC_CONTAINER" --tail 100
            exit 1
          fi

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
