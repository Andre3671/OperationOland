<!--
  Android adaptive-icon FOREGROUND layer.

  Launchers crop this to whatever mask the device uses (circle, squircle,
  teardrop…) and only the central ~66% is guaranteed to survive. The needle is
  therefore scaled to sit inside a 620px safe circle on the 1024 canvas —
  noticeably smaller than in icon.svg, which is correct, not a mistake.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(512 512) scale(0.62) translate(-512 -512)">
    <g fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="18">
      <circle cx="512" cy="512" r="336"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.55">
      <circle cx="512" cy="150" r="20"/>
      <circle cx="874" cy="512" r="20"/>
      <circle cx="512" cy="874" r="20"/>
      <circle cx="150" cy="512" r="20"/>
    </g>
    <g transform="rotate(20 512 512)">
      <path d="M512 196 L602 512 L422 512 Z" fill="#ffffff"/>
      <path d="M512 828 L602 512 L422 512 Z" fill="#ffffff" fill-opacity="0.42"/>
      <circle cx="512" cy="512" r="34" fill="#ffffff"/>
      <circle cx="512" cy="512" r="15" fill="#4f7cff"/>
    </g>
  </g>
</svg>
