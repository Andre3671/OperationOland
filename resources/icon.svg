<!--
  Operation Roadtrip — app mark.

  Source of truth for every raster icon. Regenerate with scripts/icons.sh.

  Design notes:
  - Gradient is the same primary → violet pair as the UI (#4f7cff → #a78bfa),
    so the icon reads as part of the app rather than bolted on.
  - The needle is tilted ~20°. Dead-straight north looked like a generic
    "location" glyph; the tilt says instrument, and matches the compass in the
    navigator HUD.
  - Only two tones on the needle and four rose dots. Anything finer turns to
    mush at 48px, which is where this is seen most.
  - Full-bleed square on purpose: Android and iOS apply their own mask, so
    baked-in rounded corners would punch holes in launchers that don't round.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5b86ff"/>
      <stop offset="55%"  stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.75">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- compass housing + rose -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="14">
    <circle cx="512" cy="512" r="336"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="512" cy="128" r="17"/>
    <circle cx="896" cy="512" r="17"/>
    <circle cx="512" cy="896" r="17"/>
    <circle cx="128" cy="512" r="17"/>
  </g>

  <!-- needle -->
  <g transform="rotate(20 512 512)">
    <path d="M512 196 L602 512 L422 512 Z" fill="#ffffff"/>
    <path d="M512 828 L602 512 L422 512 Z" fill="#ffffff" fill-opacity="0.42"/>
    <circle cx="512" cy="512" r="34" fill="#ffffff"/>
    <circle cx="512" cy="512" r="15" fill="#4f7cff"/>
  </g>
</svg>
