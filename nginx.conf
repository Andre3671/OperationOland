server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The sync service runs in a sibling container on the shared docker
  # network. /api/sync is the WebSocket endpoint; everything else under
  # /api/ is plain HTTP JSON.
  location = /api/sync {
    proxy_pass http://operationoland-sync:8090/api/sync;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://operationoland-sync:8090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Vue Router uses history mode — any unknown path must serve index.html
  # and let the SPA do client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames produced by Vite — safe to cache aggressively.
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Never cache index.html — it references the hashed assets above.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    image/svg+xml;
}
